services:
  curriculo:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    restart: unless-stopped

  lint:
    build: .
    volumes:
      - .:/app
    command: >
      sh -c "npm ci &&
             npx htmlhint index.html &&
             npx stylelint 'assets/css/**/*.css'"
    profiles:
      - lint