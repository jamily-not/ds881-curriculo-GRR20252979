name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint HTML
        run: npx htmlhint index.html

      - name: Lint CSS
        run: npx stylelint "assets/css/**/*.css"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Subir servidor para verificar links
        run: npx serve -l 8080 . &

      - name: Aguardar servidor iniciar
        run: npx wait-on http://localhost:8080

      - name: Verificar links quebrados
        run: npx blc http://localhost:8080 --recursive --exclude-external

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios
        run: |
          echo "Verificando estrutura..."
          test -f index.html || (echo "Erro: index.html não encontrado"    && exit 1)
          test -f assets/css/style.css || (echo "Erro: style.css não encontrado"     && exit 1)
          echo "OK — Estrutura validada"

      - name: Empacotar site para deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4